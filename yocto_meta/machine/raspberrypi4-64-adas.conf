# Minimal machine config for raspberrypi4-64 - ADAS layer
# This file intentionally minimal; customize as needed.
MACHINE = "raspberrypi4-64"
DISTRO = "adas-distro"

# Enable device tree overlays
ENABLE_UART = "1"
RPI_EXTRA_CONFIG = " \n\
    dtparam=spi=on \n\
    dtoverlay=mcp2515-can0,oscillator=8000000,interrupt=25 \n\
"
