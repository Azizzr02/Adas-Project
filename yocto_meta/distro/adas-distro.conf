# Minimal distro config for ADAS experiments
DISTRO = "adas-distro"
DISTRO_VERSION = "1.0"

# small default features - adjust as needed
DISTRO_FEATURES_append = " wifi opengl"

# Completely disable man-db to avoid postinstall issues
PACKAGE_EXCLUDE += "man-db man-pages"
BAD_RECOMMENDATIONS += "man-db man-pages"
