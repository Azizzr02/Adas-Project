# We have recipes for classes and files
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-adas"
BBFILE_PATTERN_meta-adas = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-adas = "6"

LAYERDEPENDS_meta-adas = "core"
LAYERSERIES_COMPAT_meta-adas = "scarthgap"

# Override postinst intercepts directory to use our custom scripts
INTERCEPT_DIR:prepend = "${LAYERDIR}/scripts/postinst-intercepts:"
